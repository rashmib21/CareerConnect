<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tech Domains</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #0f2a44, #020b18);
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
            padding: 60px 40px;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            color: #caa6ff;
            margin-bottom: 20px;
        }

        p {
            text-align: center;
            color: #9fb3c8;
            max-width: 800px;
            margin: 0 auto 50px;
            font-size: 16px;
        }

        .domain-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
        }

        .domain-card {
            padding: 22px;
            border-radius: 16px;
            background: linear-gradient(180deg, #0b1e36, #071425);
            box-shadow: 0 0 20px rgba(120, 120, 255, 0.08);
            cursor: pointer;
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
        }

        .domain-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent, rgba(170, 120, 255, 0.15), transparent);
            opacity: 0;
            transition: 0.4s;
        }

        .domain-card:hover::before {
            opacity: 1;
        }

        .domain-card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 0 35px rgba(160, 120, 255, 0.35);
        }

        .domain-title {
            font-size: 18px;
            font-weight: 600;
            z-index: 2;
            position: relative;
        }

        .section-title {
    margin: 60px 0 30px;
    font-size: 28px;
    color: #8be9fd;
    text-align: center;
}

.section-title {
    margin: 60px 0 30px;
    font-size: 28px;
    color: #8be9fd;
    text-align: center;
}

    </style>
</head>

<body>

<h1>{{ title }}</h1>
<p>Select a roadmap to follow a structured learning path</p>

<!-- ROLE BASED -->
<h2 class="section-title">Role-based Roadmaps</h2>
<div class="domain-grid">
    {% for domain in role_domains %}
        <div class="domain-card" onclick="openSteps('{{ domain }}', 'role')">
            <div class="domain-title">{{ domain }}</div>
        </div>
    {% endfor %}
</div>

<!-- SKILL BASED -->
{% if show_skills %}
<h2 class="section-title">Skill-based Roadmaps</h2>
<div class="domain-grid">
    {% for skill in skill_domains %}
        <div class="domain-card" onclick="openSteps('{{ skill }}', 'skill')">
            <div class="domain-title">{{ skill }}</div>
        </div>
    {% endfor %}
</div>
{% endif %}



<script>

    function openSteps(name, type) {
    window.location.href =
        "/career-roadmap/steps?" + type + "=" + encodeURIComponent(name);
}

</script>

</body>
</html>
